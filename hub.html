<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hojas">
<link rel="manifest" href="/hub/manifest.json">
<link rel="apple-touch-icon" href="/hub/icon.png">
<title>Hojas Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c11;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.07);--s3:rgba(255,255,255,.12);--bd:rgba(255,255,255,.1);--tx:#f1f4fa;--mut:#8b93a7;--y:#D97757;--yk:#fff;--ok:#36c58a;--bad:#ef6a5a;--warn:#f2b33d;
  --img:#4f7fd4;--cap:#8f73f5;--vid:#3aa57e;--sfx:#e0775c;--r:22px;--glass:blur(18px) saturate(140%);--pri:#D97757}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@font-face{font-family:"HS UI";src:url("/hub/ui-font.otf") format("opentype");font-display:swap;size-adjust:118%;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
html,body{margin:0;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;min-height:100%}
body{background:radial-gradient(70% 40% at 85% -10%,rgba(217,119,87,.22),transparent 70%),radial-gradient(50% 30% at 0% 100%,rgba(143,115,245,.10),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:#9fc0ff}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
header{padding:22px 4px 14px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
header .t{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
header h1{font-family:"HS UI","IBM Plex Sans Arabic",sans-serif;font-size:44px;line-height:1.1;margin:0;font-weight:700}
header .by{color:var(--mut);font-size:13px;direction:ltr;margin-inline-start:auto;align-self:flex-end;padding-bottom:6px}
.logo{width:30px;height:30px;flex:none;position:relative;direction:ltr;color:var(--tx)}
.logo i{position:absolute;left:0;height:18%;background:currentColor}
.logo i:nth-child(1){top:0;width:57.9%}.logo i:nth-child(2){top:41%;left:24%;width:76%}.logo i:nth-child(3){top:82%;width:39.9%}
.status{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin-top:8px;width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--mut)}.dot.warn{background:var(--warn)}
.bat{display:inline-flex;align-items:center;gap:1px}
.bat b{width:24px;height:12px;border:1.5px solid var(--mut);border-radius:3px;padding:1px;display:flex}
.bat b i{display:block;height:100%;border-radius:1px;background:var(--ok)}
.bat u{width:2px;height:5px;background:var(--mut);border-radius:0 1px 1px 0}
/* 4.7.1: التغبيش انشال من البطاقات والأزرار (يثقل الجوال) */
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.feat{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer;margin-bottom:16px}
.feat .th{width:58px;height:72px;border-radius:12px;object-fit:cover;background:var(--s2)}
.feat h3{margin:0 0 6px;font-size:21px;font-weight:700;line-height:1.35}
.feat .acts{display:none}
.sub{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13.5px;min-width:0}
.sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .dot{width:6px;height:6px;background:var(--mut)}
.sub.wait .dot{background:var(--warn)}.sub.work .dot{background:var(--y)}.sub.ready .dot{background:var(--ok)}.sub.err .dot{background:var(--bad)}
.sub.stop .dot{background:var(--bad)}.sub small{color:var(--mut);font-size:.92em}
.stopbox{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding:12px 14px;border:1px solid rgba(229,96,78,.35);border-radius:14px}.stopbox b{font-size:14px}.stopbox span{font-size:13.5px;line-height:1.7}.stopbox small{color:var(--mut);font-size:12px;line-height:1.6}
.feat .dur{font-size:24px;color:var(--mut);font-variant-numeric:tabular-nums;direction:ltr;font-weight:500}
.lanes{grid-column:1/-1;display:grid;gap:6px;margin-top:6px;direction:ltr;overflow:hidden}   /* 4.28: شريط أطول من المقطع ما يطلع برا */
.lane{position:relative;height:9px}
.lane i{position:absolute;top:0;height:100%;border-radius:5px;min-width:4px}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;padding:10px 4px;border-radius:14px;color:var(--mut);font-size:15px}
.seg button.on{background:rgba(217,119,87,.22);color:#fff;font-weight:600}
.seg button small{font-size:11px;color:var(--y);margin-inline-start:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:9/14;border-radius:20px;overflow:hidden;background:var(--s2);cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:transform .15s,box-shadow .15s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.tile .ov b{display:block;font-size:14.5px;line-height:1.4;font-weight:600}
.tile .ov .sub{font-size:12px;color:#d6d6db;margin-top:2px}
.tile .tm{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border-radius:9px;padding:2px 8px;font-size:12px;direction:ltr}
.tile .tg2{position:absolute;top:10px;right:10px;background:rgba(217,119,87,.85);border-radius:9px;padding:2px 8px;font-size:11.5px}
.tile .ph{display:grid;place-items:center;height:100%;color:var(--mut);font-size:13px;padding:20px;text-align:center}
.tile .hov{display:none}
.tile .pb{position:absolute;inset:auto 12px 12px 12px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.tile .pb i{display:block;height:100%;background:var(--y);width:30%;animation:ind 1.6s ease-in-out infinite}
@keyframes ind{0%{margin-inline-start:-30%}100%{margin-inline-start:100%}}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.9}
.empty .btn{margin-top:14px}
h4.sec{font-size:15px;color:var(--tx);margin:22px 4px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h4.sec small{color:var(--mut);font-weight:400;font-size:13px}
.cmd{margin-bottom:12px}
.cmd .hd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.cmd .th{width:52px;height:64px;border-radius:12px;object-fit:cover;background:var(--s2)}
.cmd small{color:var(--mut);font-size:13px}
.cmd h3{margin:3px 0 6px;font-size:18px;font-weight:700}
.cmd p{margin:0;color:#cfcfd5;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.cmd .res{margin:12px 0 0;color:var(--tx)}
.cmd .ago{color:var(--mut);font-size:12.5px;white-space:nowrap}
.cmd .st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:8px;background:var(--s3);color:var(--mut);margin-inline-start:6px}
.cmd .st.running{color:var(--y)}.cmd .st.done{color:var(--ok)}.cmd .st.err{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 16px;font-weight:600;font-size:14.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.y{background:var(--pri);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px rgba(63,127,240,.25)}
.btn.wide{width:100%;padding:14px;font-size:16px;border-radius:16px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.big{font-size:44px;font-weight:700;direction:ltr;display:flex;align-items:center;gap:12px;justify-content:flex-end}
.lbl{color:var(--mut);font-size:13.5px}
.bar{height:8px;border-radius:5px;background:var(--s3);overflow:hidden;margin:10px 0 6px;direction:ltr}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cap),var(--img),var(--vid))}
.warn{color:var(--sfx);font-size:13px}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg{width:56px;height:32px;border-radius:16px;background:var(--s3);position:relative;flex:none;cursor:pointer;border:1px solid var(--bd)}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#e8e8ec;transition:inset-inline-start .15s}
.tg.on{background:#D97757;border-color:#D97757}
.tg.on::after{inset-inline-start:27px;background:#fff}
.list .it{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--bd)}
.list .it:last-child{border-bottom:0}
.list .it svg{flex:none;color:var(--y)}
.list .it b{font-weight:600}
.list .it span{margin-inline-start:auto;color:var(--mut);font-size:14px;text-align:left}
.two:has(> :nth-child(3)){grid-template-columns:1fr 1fr 1fr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.note{color:var(--mut);font-size:13px;line-height:1.8;margin:12px 4px}
.qr{background:#fff;border-radius:16px;padding:10px;width:150px;margin:10px 0}
.copy{display:flex;gap:8px;align-items:center;background:var(--s2);border-radius:12px;padding:8px 10px;font-size:12.5px;direction:ltr;word-break:break-all}
.copy span{flex:1}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 28px));display:flex;gap:10px;z-index:20}
nav .tabs{flex:1;display:flex;background:rgba(16,19,27,.84);border:1px solid var(--bd);border-radius:26px;padding:6px}
nav .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:20px;color:var(--mut);font-size:12.5px;position:relative}
nav .tabs button.on{background:rgba(255,255,255,.1);color:var(--tx)}
nav .tabs button.on::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--y)}
nav .fab{width:66px;flex:none;background:var(--pri);color:#fff;border-radius:24px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sheet{position:fixed;inset:0;background:rgba(3,5,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;z-index:50;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--s1);border:1px solid var(--bd);border-radius:28px 28px 0 0;width:min(560px,100%);padding:12px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.sheet .ph{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px}
.sheet .ph img{width:96px;height:140px;object-fit:cover;border-radius:16px;background:var(--s2)}
.sheet h2{margin:0 0 6px;font-size:24px}
.sheet h5{margin:16px 2px 8px;font-size:14px;color:var(--mut);font-weight:500}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--bd);margin-bottom:10px;cursor:pointer;width:100%;text-align:start;transition:border-color .15s,background .15s}
.opt.on{border-color:rgba(217,119,87,.75);background:rgba(217,119,87,.14)}
.opt b{display:block;font-size:16px}.opt small{color:var(--mut);font-size:13px;line-height:1.6}
.opt svg{flex:none;color:var(--y)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);font-size:14px;color:var(--mut)}
.chip.on{background:rgba(217,119,87,.22);border-color:rgba(217,119,87,.6);color:#fff;font-weight:600}
.src2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:4px;margin-bottom:12px}
.src2 button{padding:10px;border-radius:12px;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:center}
.src2 button.on{background:rgba(217,119,87,.22);color:#fff;font-weight:600}
.field{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:6px 6px 6px 12px}
.field input{flex:1;background:none;border:0;outline:none;min-width:0;padding:6px 4px;direction:ltr;text-align:left}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:16px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
.drop b{color:var(--tx);display:block;margin-bottom:4px}
.drop.hot{border-color:var(--y);background:rgba(217,119,87,.08)}
.sites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;color:var(--mut);font-size:12px}
.sites span{padding:2px 8px;border-radius:8px;background:var(--s1)}
textarea{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;min-height:64px;outline:none;resize:vertical}
.prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;width:0;background:var(--y)}
.seg2{display:flex;gap:8px;flex-wrap:wrap}
.tkb{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(242,179,61,.16);color:var(--warn);border:1px solid rgba(242,179,61,.35);vertical-align:middle;margin-inline-start:4px}
#tok{position:fixed;inset:0;z-index:80;background:rgba(4,6,10,.8);display:grid;place-items:center;padding:16px}
#tok .in{background:#151922;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:20px;max-width:420px;width:100%;line-height:1.8}#tok .in p{color:var(--tx)}#tok .ck input{width:18px;height:18px;min-width:18px;flex:none;margin:0;padding:0}#tok .ck{white-space:normal;width:auto;height:auto;border:0;border-radius:0;place-items:initial}#tok .box{background:#2a2316;border-color:rgba(242,179,61,.45)}
#tok h3{margin:0 0 6px;font-size:18px} #tok .ck{display:flex;gap:8px;align-items:center;margin:4px 0 14px;font-size:13.5px;color:var(--mut)} #tok .acts{display:flex;gap:8px}
.st-tip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd);line-height:1.8} .st-tip:first-of-type{border-top:0} .st-tip b{min-width:46px;color:var(--ok);direction:ltr;text-align:center}
.st-tip.dn b{color:var(--warn)} .pr-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)} .pr-row input{width:100%;padding:8px 10px}
.stsrc{margin-bottom:12px;border-color:rgba(242,179,61,.35)!important}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}.pill.on{background:rgba(127,183,126,.14);color:#8fc18e;border:1px solid rgba(127,183,126,.35)}
.cnr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.cnt{flex:1;min-width:0}.cnt b{display:block;font-size:14px}.cnt span{display:block;font-size:12px;opacity:.75;line-height:1.6;overflow-wrap:anywhere}
.cnl{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:10.5px;font-weight:700}.cnl.hg{background:#e9f45a;color:#111;font-size:15px}.cnl.mc{letter-spacing:.3px}
.cnd{border-top:1px solid var(--bd);padding:10px 0 2px}.cnd summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}.cnd summary::-webkit-details-marker{display:none}.cnd summary b{font-size:14px}
.cnd .cnr .cnt{padding-inline-start:4px}.cnf{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}.cnf input{flex:1 1 140px;min-width:0}
.clst{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.clst i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--s2,rgba(255,255,255,.06));color:var(--mut,#999)}.clst.ok i{background:rgba(127,183,126,.18);color:#8fc18e}.clst div{flex:1;min-width:0}.clst b{display:block;font-size:14px}.clst span{display:block;font-size:12px;opacity:.75;line-height:1.6;overflow-wrap:anywhere}.pill.off{background:rgba(242,179,61,.14);color:var(--warn);border:1px solid rgba(242,179,61,.35)}
.stnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stnums div{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stnums b{font-size:20px;direction:ltr;text-align:start}.stnums span{font-size:12px;color:var(--mut)}
.pr-row input,.pr-row select{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:8px 10px;outline:none}
.pr-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .fac-st{font-size:13px;color:var(--mut);line-height:1.8;margin-top:8px}
.clb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid rgba(242,179,61,.45);background:rgba(242,179,61,.08);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.7}
.clb>div{flex:1;min-width:200px}.clb b{display:block;font-weight:600}.clb span{color:var(--mut)}
.job .cn{display:block;color:var(--warn);font-size:12px;margin-top:4px}
.box{border:1px solid rgba(242,179,61,.4);background:rgba(242,179,61,.09);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.7;margin:10px 0}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(30,34,44,.95);border:1px solid var(--bd);padding:10px 16px;border-radius:14px;font-size:14px;display:none;z-index:60;max-width:90%}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin:0 0 14px}
.search input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.live{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:18px;background:rgba(217,119,87,.12);border:1px solid rgba(217,119,87,.35);font-size:14px;cursor:pointer}
.live i{width:9px;height:9px;border-radius:50%;background:#D97757;flex:none;animation:lv 1.4s infinite}
.live span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes lv{50%{opacity:.3}}
.resume{font-size:11.5px;color:#9fc0ff;margin-top:3px}
/* شغل جاري + حلقات طويلة */
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.row::-webkit-scrollbar{display:none}
.job{flex:none;width:270px;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;cursor:pointer}
.job b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.job .prog{margin:10px 0 2px}
.job .prog.ind i{width:30%;animation:ind 1.6s ease-in-out infinite}
.job small{color:var(--mut);font-size:12px}
.eps{display:grid;gap:10px}
.ep{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:10px;cursor:pointer}
.ep .th{width:132px;aspect-ratio:16/9;border-radius:12px;object-fit:cover;background:var(--s2);display:block}

function playCand(id){ const c=(EPD.cands||[]).find(x=>x.id===id), v=$('#pv'), yt=$('#ytp'); if(c&&!v&&yt&&EPD.vid){ PLAYC=id; yt.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(EPD.vid)+'?rel=0&autoplay=1&start='+Math.floor(c.from)+'&end='+Math.ceil(c.to); drawCands(); if(!DESK()) scrollTo({top:0,behavior:'smooth'}); return; } if(!c||!v) return; PLAYC=id; v.currentTime=c.from; v.play().catch(()=>{}); drawCands(); if(!DESK()) scrollTo({top:0,behavior:'smooth'}); }

document.addEventListener('click',async e=>{ if(e.target.closest('[data-mvf],#fmenu')) return; const el=e.target.closest('#ldRetry,[data-hit],[data-sro],#qX,[data-tab],[data-f],[data-open],[data-go],[data-watch],[data-dup],[data-trash],[data-ren],[data-prep],[data-rev],[data-new],[data-awake],[data-lang],[data-ep],[data-retry],[data-nsrc],[data-nmode],[data-npick],[data-nn],[data-nlen],[data-ck],[data-cid],[data-pc],[data-nud],[data-crm],[data-rc],[data-si],[data-et],[data-edit],[data-cpu],#fab,#bDbRe,[data-tokask],[data-fac],[data-facm],[data-faco],[data-facn],[data-unml],#bClFind,#bClTest,#bClHide,#bTest,#bStopC,#bStopE,#bRestart,#bScreen,#epMake,#epRank,#epRe'); if(!el) return; const d=el.dataset;

  if(d.dup){ e.stopPropagation(); el.disabled=true; const r=await api('dup',{id:d.dup}); el.disabled=false; if(r.ok){ closeSheet(); toast(t('done')); await load(); go(r.id); } else toast(srvEn(r.msg)||t('failed')); return; }

  if(el.id==='epMake'){ if(EDIT==='claude'&&!(await tokenGo('edit','big'))) return; const ids=[...SEL].filter(id=>(EPD.cands||[]).some(c=>c.id===id&&!c.made)); if(!ids.length) return; el.disabled=true; const r=await api('ep_build',{id:EP,picks:ids,edit:EDIT}); if(r.ok){ toast(t('building')); SEL.clear(); closeEp(); } else { el.disabled=false; toast(srvEn(r.msg)||t('failed')); } return; }
  if(el.id==='epRank'){ if(!(await tokenGo('rank','mid'))) return; const r=await api('ep_rank',{id:EP}); if(r.ok){ EPD.ranking=true; renderEp(); } else toast(srvEn(r.msg)||t('failed')); return; }
  if(el.id==='epRe'){ const r=await api('ep_suggest',{id:EP}); if(r.ok){ EPD.cands=r.cands; drawCands(); drawTr(); drawPick(); } return; }

function confirmSheet(q,yes){ sheet('<h2 style="font-size:20px;margin-bottom:16px">'+esc(q)+'</h2><div class="two"><button class="btn" id="cNo">'+(LANG==='ar'?'لا':'No')+'</button><button class="btn y" id="cYes">'+(LANG==='ar'?'إيه':'Yes')+'</button></div>'); $('#cNo').onclick=closeSheet; $('#cYes').onclick=()=>{ closeSheet(); yes(); }; }

{ const m=location.hash.match(/ep=(\w+)/); if(m){ EP=m[1]; } }
